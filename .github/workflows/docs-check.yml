name: docs-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bilingual-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every page has an EN/FR twin and relative links resolve
        run: python tools/check_docs.py
